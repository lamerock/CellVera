name: Build CellVera

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore CellVera.csproj

      - name: Build CellVera
        run: dotnet build CellVera.csproj --configuration Release --no-restore

      - name: Publish CellVera
        run: >
          dotnet publish CellVera.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "${{ github.workspace }}\artifacts\CellVera"

      - name: Upload CellVera build
        uses: actions/upload-artifact@v4
        with:
          name: CellVera-win-x64
          path: artifacts/CellVera/
          if-no-files-found: error
          retention-days: 14